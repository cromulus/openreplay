# vim: ft=yaml
x-openreplay-app-depends-on: &openreplay-app-depends-on
  db-migration:
    condition: service_completed_successfully
  clickhouse-migration:
    condition: service_completed_successfully
  kafka-migration:
    condition: service_completed_successfully

services:

  postgresql:
    image: ghcr.io/openreplay/postgres:${POSTGRES_VERSION}
    container_name: postgres
    volumes:
      - pgdata:/bitnami/postgresql
    networks:
      openreplay-net:
        aliases:
          - postgresql.db.svc.cluster.local
    environment:
      POSTGRESQL_PASSWORD: "${COMMON_PG_PASSWORD}"

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: clickhouse
    volumes:
      - clickhouse:/var/lib/clickhouse
    networks:
      openreplay-net:
        aliases:
          - clickhouse-openreplay-clickhouse.db.svc.cluster.local
    environment:
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

  redis:
    image: ghcr.io/openreplay/valkey:${REDIS_VERSION}
    container_name: redis
    volumes:
      - redisdata:/data
    networks:
      openreplay-net:
        aliases:
          - redis-master.db.svc.cluster.local
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"

  minio:
    image: rustfs/rustfs:${RUSTFS_VERSION}
    container_name: minio
    volumes:
      - miniodata:/data
    networks:
      openreplay-net:
        aliases:
          - minio.db.svc.cluster.local
    environment:
      RUSTFS_ACCESS_KEY: ${COMMON_S3_KEY}
      RUSTFS_SECRET_KEY: ${COMMON_S3_SECRET}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_VOLUMES: /data

  kafka:
    image: ghcr.io/openreplay/kafka:${KAFKA_VERSION}
    container_name: kafka
    hostname: kafka
    volumes:
      - kafkadata:/bitnami/kafka
    networks:
      openreplay-net:
        aliases:
          - kafka.db.svc.cluster.local
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: "${COMMON_KAFKA_CLUSTER_ID}"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka.db.svc.cluster.local:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka.db.svc.cluster.local:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /bitnami/kafka/data
      LOG_DIR: /bitnami/kafka/logs
      KAFKA_MESSAGE_MAX_BYTES: "3145728"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "3145728"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_RETENTION_BYTES: "1073741824"
      KAFKA_LOG_SEGMENT_BYTES: "1073741824"
      KAFKA_CFG_LOG_FLUSH_INTERVAL_MESSAGES: "10000"
      KAFKA_CFG_LOG_FLUSH_INTERVAL_MS: "1000"
      KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_NUM_IO_THREADS: "8"
      KAFKA_CFG_NUM_NETWORK_THREADS: "3"
      KAFKA_CFG_NUM_PARTITIONS: "1"
      KAFKA_CFG_NUM_RECOVERY_THREADS_PER_DATA_DIR: "1"
      KAFKA_CFG_SOCKET_RECEIVE_BUFFER_BYTES: "102400"
      KAFKA_CFG_SOCKET_REQUEST_MAX_BYTES: "104857600"
      KAFKA_CFG_SOCKET_SEND_BUFFER_BYTES: "102400"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DELETE_TOPIC_ENABLE: "false"
      KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_CFG_SUPER_USERS: "User:admin"
    restart: unless-stopped

  kafka-migration:
    image: ghcr.io/openreplay/kafka:${KAFKA_VERSION}
    container_name: kafka-migration
    depends_on:
      - kafka
    networks:
      - openreplay-net
    volumes:
      - ../helmcharts/openreplay/files/kafka.sh:/tmp/kafka.sh
    environment:
      KAFKA_HOST: kafka.db.svc.cluster.local
      KAFKA_PORT: 9092
      KAFKA_SSL: "false"
      REPLICATION_FACTOR: 1
    entrypoint:
      - /bin/bash
      - -c
      - |
          until /usr/lib/kafka/bin/kafka-topics.sh --bootstrap-server kafka.db.svc.cluster.local:9092 --list >/dev/null 2>&1; do
              echo "Waiting for Kafka to be ready..."
              sleep 2
          done
          PATH="/usr/lib/kafka/bin:$PATH" bash /tmp/kafka.sh init

  fs-permission:
    image: debian:stable-slim
    container_name: fs-permission
    volumes:
      - shared-volume:/mnt/efs
      - miniodata:/mnt/minio
      - pgdata:/mnt/postgres
    entrypoint:
      - /bin/bash
      - -c
      - |
        chown -R 1001:1001 /mnt/{efs,minio,postgres}
    restart: on-failure

  minio-migration:
    image: minio/mc:latest
    container_name: minio-migration
    depends_on:
      - minio
      - fs-permission
    networks:
      - openreplay-net
    volumes:
      - ../helmcharts/openreplay/files/minio.sh:/tmp/minio.sh
    environment:
      MINIO_HOST: http://minio.db.svc.cluster.local:9000
      MINIO_ACCESS_KEY: ${COMMON_S3_KEY}
      MINIO_SECRET_KEY: ${COMMON_S3_SECRET}
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
          # Wait for RustFS to be ready
          until bash -c 'echo > /dev/tcp/minio/9000' 2>/dev/null; do
              echo "Waiting for RustFS server to be ready..."
              sleep 1
          done
          bash /tmp/minio.sh init || exit 100

  db-migration:
    image: ghcr.io/openreplay/postgres:${POSTGRES_VERSION}
    container_name: db-migration
    depends_on:
      - postgresql
      - minio-migration
    networks:
      - openreplay-net
    volumes:
      - ../schema:/opt/openreplay/openreplay/scripts/schema:ro
      - ../helmcharts/openreplay/files/postgresql.sh:/tmp/postgresql.sh:ro
      - ./dokploy-migrate.sh:/tmp/dokploy-migrate.sh:ro
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${COMMON_PG_PASSWORD}
      COMMON_VERSION: "${COMMON_VERSION:-v1.27.0}"
      OPENREPLAY_FROM_VERSION: "${OPENREPLAY_FROM_VERSION:-}"
      OPENREPLAY_TO_VERSION: "${OPENREPLAY_TO_VERSION:-v1.27.0}"
    entrypoint:
      - /bin/bash
      - -c
      - |
          until psql -c '\q'; do
          echo "PostgreSQL is unavailable - sleeping"
          sleep 1
          done
          echo "PostgreSQL is up - executing command"
          bash /tmp/dokploy-migrate.sh postgresql

  clickhouse-migration:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: clickhouse-migration
    depends_on:
      - clickhouse
      - minio-migration
    networks:
      - openreplay-net
    volumes:
      - ../schema:/opt/openreplay/openreplay/scripts/schema:ro
      - ../helmcharts/openreplay/files/clickhouse.sh:/tmp/clickhouse.sh:ro
      - ./dokploy-migrate.sh:/tmp/dokploy-migrate.sh:ro
    environment:
      CH_HOST: "clickhouse-openreplay-clickhouse.db.svc.cluster.local"
      CH_PORT: "9000"
      CH_PORT_HTTP: "8123"
      CH_USERNAME: "default"
      CH_PASSWORD: ""
      COMMON_VERSION: "${COMMON_VERSION:-v1.27.0}"
      OPENREPLAY_FROM_VERSION: "${OPENREPLAY_FROM_VERSION:-}"
      OPENREPLAY_TO_VERSION: "${OPENREPLAY_TO_VERSION:-v1.27.0}"
    entrypoint:
      - /bin/bash
      - -c
      - |
          # Checking variable is empty. Shell independant method.
          # Wait for ClickHouse to be ready
          until nc -z -v -w30 clickhouse-openreplay-clickhouse.db.svc.cluster.local 9000; do
              echo "Waiting for ClickHouse server to be ready..."
              sleep 1
          done

          echo "clickhouse is up - executing command"
          bash /tmp/dokploy-migrate.sh clickhouse
  
