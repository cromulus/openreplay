    container_name: chalice
    networks:
      openreplay-net:
        aliases:
          - chalice-openreplay
          - chalice-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    env_file:
      - docker-envs/chalice.env
    environment:
      ENABLE_SSO: "${ENABLE_SSO:-true}"
      SAML2_MD_URL: "${SAML2_MD_URL:-}"
      idp_entityId: "${idp_entityId:-}"
      idp_sso_url: "${idp_sso_url:-}"
      idp_x509cert: "${idp_x509cert:-}"
      idp_sls_url: "${idp_sls_url:-}"
      idp_name: "${idp_name:-}"
      idp_tenantKey: "${idp_tenantKey:-}"
      enforce_SSO: "${enforce_SSO:-false}"
      sp_crt: "${sp_crt:-}"
      sp_key: "${sp_key:-}"
      saml_strict: "${saml_strict:-true}"
      saml_debug: "${saml_debug:-false}"
      EMAIL_HOST: "${EMAIL_HOST:-}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_USER: "${EMAIL_USER:-}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD:-}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-true}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-false}"
      EMAIL_SSL_KEY: "${EMAIL_SSL_KEY:-}"
      EMAIL_SSL_CERT: "${EMAIL_SSL_CERT:-}"
      EMAIL_FROM: "${EMAIL_FROM:-OpenReplay<do-not-reply@openreplay.com>}"
