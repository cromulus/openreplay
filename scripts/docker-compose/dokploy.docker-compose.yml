# vim: ft=yaml
x-openreplay-app-depends-on: &openreplay-app-depends-on
  db-migration:
    condition: service_completed_successfully
  clickhouse-migration:
    condition: service_completed_successfully

services:

  postgresql:
    image: ghcr.io/openreplay/postgres:${POSTGRES_VERSION}
    container_name: postgres
    volumes:
      - pgdata:/bitnami/postgresql
    networks:
      openreplay-net:
        aliases:
          - postgresql.db.svc.cluster.local
    environment:
      POSTGRESQL_PASSWORD: "${COMMON_PG_PASSWORD}"

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: clickhouse
    volumes:
      - clickhouse:/var/lib/clickhouse
    networks:
      openreplay-net:
        aliases:
          - clickhouse-openreplay-clickhouse.db.svc.cluster.local
    environment:
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

  redis:
    image: ghcr.io/openreplay/valkey:${REDIS_VERSION}
    container_name: redis
    volumes:
      - redisdata:/data
    networks:
      openreplay-net:
        aliases:
          - redis-master.db.svc.cluster.local
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"

  minio:
    image: rustfs/rustfs:${RUSTFS_VERSION}
    container_name: minio
    volumes:
      - miniodata:/data
    networks:
      openreplay-net:
        aliases:
          - minio.db.svc.cluster.local
    environment:
      RUSTFS_ACCESS_KEY: ${COMMON_S3_KEY}
      RUSTFS_SECRET_KEY: ${COMMON_S3_SECRET}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_VOLUMES: /data

  fs-permission:
    image: debian:stable-slim
    container_name: fs-permission
    volumes:
      - shared-volume:/mnt/efs
      - miniodata:/mnt/minio
      - pgdata:/mnt/postgres
    entrypoint:
      - /bin/bash
      - -c
      - |
        chown -R 1001:1001 /mnt/{efs,minio,postgres}
    restart: on-failure

  minio-migration:
    build:
      context: ./mc-client
    pull_policy: build
    container_name: minio-migration
    depends_on:
      - minio
      - fs-permission
    networks:
      - openreplay-net
    volumes:
      - ../helmcharts/openreplay/files/minio.sh:/tmp/minio.sh
    environment:
      MINIO_HOST: http://minio.db.svc.cluster.local:9000
      MINIO_ACCESS_KEY: ${COMMON_S3_KEY}
      MINIO_SECRET_KEY: ${COMMON_S3_SECRET}
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
          # Wait for RustFS to be ready
          until bash -c 'echo > /dev/tcp/minio/9000' 2>/dev/null; do
              echo "Waiting for RustFS server to be ready..."
              sleep 1
          done
          bash /tmp/minio.sh init || exit 100

  db-migration:
    image: ghcr.io/openreplay/postgres:${POSTGRES_VERSION}
    container_name: db-migration
    depends_on:
      - postgresql
      - minio-migration
    networks:
      - openreplay-net
    volumes:
      - ../schema:/opt/openreplay/openreplay/scripts/schema:ro
      - ../helmcharts/openreplay/files/postgresql.sh:/tmp/postgresql.sh:ro
      - ./dokploy-migrate.sh:/tmp/dokploy-migrate.sh:ro
    environment:
      PGHOST: postgresql
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${COMMON_PG_PASSWORD}
      COMMON_VERSION: "${COMMON_VERSION:-v1.27.0}"
      OPENREPLAY_FROM_VERSION: "${OPENREPLAY_FROM_VERSION:-}"
      OPENREPLAY_TO_VERSION: "${OPENREPLAY_TO_VERSION:-v1.27.0}"
    entrypoint:
      - /bin/bash
      - -c
      - |
          until psql -c '\q'; do
          echo "PostgreSQL is unavailable - sleeping"
          sleep 1
          done
          echo "PostgreSQL is up - executing command"
          bash /tmp/dokploy-migrate.sh postgresql

  clickhouse-migration:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: clickhouse-migration
    depends_on:
      - clickhouse
      - minio-migration
    networks:
      - openreplay-net
    volumes:
      - ../schema:/opt/openreplay/openreplay/scripts/schema:ro
      - ../helmcharts/openreplay/files/clickhouse.sh:/tmp/clickhouse.sh:ro
      - ./dokploy-migrate.sh:/tmp/dokploy-migrate.sh:ro
    environment:
      CH_HOST: "clickhouse-openreplay-clickhouse.db.svc.cluster.local"
      CH_PORT: "9000"
      CH_PORT_HTTP: "8123"
      CH_USERNAME: "default"
      CH_PASSWORD: ""
      COMMON_VERSION: "${COMMON_VERSION:-v1.27.0}"
      OPENREPLAY_FROM_VERSION: "${OPENREPLAY_FROM_VERSION:-}"
      OPENREPLAY_TO_VERSION: "${OPENREPLAY_TO_VERSION:-v1.27.0}"
    entrypoint:
      - /bin/bash
      - -c
      - |
          # Checking variable is empty. Shell independant method.
          # Wait for ClickHouse to be ready
          until nc -z -v -w30 clickhouse-openreplay-clickhouse.db.svc.cluster.local 9000; do
              echo "Waiting for ClickHouse server to be ready..."
              sleep 1
          done

          echo "clickhouse is up - executing command"
          bash /tmp/dokploy-migrate.sh clickhouse

  alerts-openreplay:
    image: ${COMMON_APP_IMAGE_REGISTRY:-public.ecr.aws/p1t3u8a3}/alerts:${COMMON_VERSION:-v1.27.0}
    domainname: app.svc.cluster.local
    container_name: alerts
    networks:
      openreplay-net:
        aliases:
          - alerts-openreplay
          - alerts-openreplay.app.svc.cluster.local
    volumes:
      - shared-volume:/mnt/efs
    env_file:
      - docker-envs/alerts.env
    environment: {}  # Fallback empty environment if env_file is missing
    depends_on: *openreplay-app-depends-on
    restart: unless-stopped


