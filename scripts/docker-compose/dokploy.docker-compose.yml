      idp_entityId: "${idp_entityId:-}"
      idp_sso_url: "${idp_sso_url:-}"
      idp_x509cert: "${idp_x509cert:-}"
      idp_sls_url: "${idp_sls_url:-}"
      idp_name: "${idp_name:-}"
      idp_tenantKey: "${idp_tenantKey:-}"
